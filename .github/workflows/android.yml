# Builds and checks the Android app on GitHub's servers on every push, so nothing
# has to be installed locally. The debug APK is attached to each run as a download.
name: Android build

# Build each change once: on pull requests, and again after merging into main.
# (Pushing a feature branch alone doesn't build; open a PR, or use "Run workflow" on the Actions tab.)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: this workflow only needs to read the code.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Uses Gradle 8.9 directly (matches android/gradle/wrapper/gradle-wrapper.properties).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build, lint and unit-test
        run: gradle assembleDebug lintDebug testDebugUnitTest --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: identity-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-debug.html
          retention-days: 14
          if-no-files-found: ignore
